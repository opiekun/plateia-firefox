name: Build Firefox artifact
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create unsigned development package
        run: cd extension && zip -r ../plateia-firefox-unsigned.zip . -x '.*'
      - uses: actions/upload-artifact@v4
        with:
          name: plateia-firefox-unsigned
          path: plateia-firefox-unsigned.zip
